</head>
<body>

    <a href="index.html" class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </div>
      <div class="brand-text">
        <h1>ג'ובנוער</h1>

    <button class="nav-toggle" aria-label="תפריט">☰</button>
    <nav class="main-nav">

  </div>
</header>

<main class="container">
  <section class="page-hero">

    <p>תשובות לשאלות הכי נפוצות 💚</p>
  </section>

  <div class="tab-switch">
    <button class="tab-btn active" data-tab="teens">🧑 בני נוער</button>
    <button class="tab-btn" data-tab="employers">💼 מעסיקים</button>
  </div>

  <div id="teens" class="tab-panel"></div>
  <div id="employers" class="tab-panel" style="display:none;"></div>

  <div class="trust-box">
    <div style="font-size:1.6rem;">🛡️</div>
    <div>הבטיחות שלכם חשובה לנו</div>
    <p>אנחנו בודקים את כל המודעות והמעסיקים כדי לשמור על מרחב בטוח ואמין לכולם.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-row">
    <span>© 2026 ג'ובנוער - עבודה ראשונה מתחילה כאן</span>
    <span><a href="index.html">חיפוש עבודה</a> · <a href="#" class="wa-general-link" target="_blank" rel="noopener">צרו קשר בוואטסאפ</a></span>
  </div>
</footer>

<script src="js/jobs.js"></script>
<script src="js/main.js"></script>
<script>
  const FAQ = {
    teens: [
      {
        icon: "➕",
        q: "איך אני נרשם/ה לג'ובנוער?",
        a: 'לחצו על "הרשמה" ובחרו "בן נוער". מלאו את הפרטים הבסיסיים ותוכלו להתחיל לחפש משרות שמתאימות לכם.'
      },
      {
        icon: "🏷️",
        q: "האם השירות בחינם?",
        a: "כן! ג'ובנוער הוא שירות חינמי לחלוטין לכל בני הנוער."
      },
      {
        icon: "🎂",
        q: "מאיזה גיל אפשר להשתמש בג'ובנוער?",
        a: "הפלטפורמה מיועדת לבני נוער מגיל 14 עד 18."
      },
      {
        icon: "🚀",
        q: "איך אני מגיש/ה מועמדות למשרה?",
        a: 'היכנסו למשרה שמעניינת אתכם ולחצו על "הגשת מועמדות". תמלאו את הפרטים שלכם ונשלח אותם ישירות למעסיק בוואטסאפ.'
      },
      {
        icon: "🚫",
        q: "האם המעסיק רואה את הטלפון שלי?",
        a: "המעסיק רואה רק את הפרטים שבחרתם לשתף בטופס הגשת המועמדות. כל ההתקשרות נעשית ביוזמתכם דרך WhatsApp."
      },
      {
        icon: "🔎",
        q: "איך אני מחפש/ת משרה שמתאימה לי?",
        a: 'בעמוד "חיפוש עבודה" אפשר לחפש לפי תפקיד, עסק או עיר, ולסנן לפי גיל מינימלי ומיקום.'
      },
      {
        icon: "💬",
        q: "איך אני יוצר/ת קשר עם המעסיק לפני שאני נרשם/ת?",
        a: 'בעמוד המשרה יש כפתור "שיחה עם המעסיק" שפותח שיחת WhatsApp ישירה, כדי לשאול שאלות לפני הגשת המועמדות.'
      },
      {
        icon: "🎧",
        q: "מה עושים אם נתקלתי בבעיה?",
        a: "אפשר לפנות אלינו דרך כפתור הוואטסאפ הצף באתר. אנחנו כאן בשבילכם!"
      }
    ],
    employers: [
      {
        icon: "📢",
        q: "איך אני מפרסם/ת משרה חדשה?",
        a: 'בשלב ה-MVP פרסום משרות מתבצע ע"י צוות ג\'ובנוער בלבד. שלחו לנו את פרטי המשרה בוואטסאפ ואנחנו נעלה אותה עבורכם. בקרוב תתאפשר הרשמה עצמאית למעסיקים.'
      },
      {
        icon: "🏷️",
        q: "האם השירות בחינם עבור מעסיקים?",
        a: "כן, בשלב ה-MVP הפרסום חינמי לחלוטין לכל העסקים."
      },
      {
        icon: "📥",
        q: "איך אני מקבל/ת מועמדויות?",
        a: "כל מועמד/ת שמגיש/ה מועמדות למשרה שלכם ישלח/תשלח לכם הודעת WhatsApp עם כל הפרטים הרלוונטיים ישירות."
      },
      {
        icon: "✏️",
        q: "איך אני מעדכן/ת פרטים של משרה קיימת?",
        a: "פנו אלינו בוואטסאפ עם פרטי המשרה והעדכון המבוקש, ונטפל בזה בהקדם."
      },
      {
        icon: "🛡️",
        q: "איך אתם שומרים על אמינות המשרות?",
        a: "אנחנו בודקים ידנית כל משרה ועסק לפני הפרסום, כדי לשמור על סביבה בטוחה ואמינה לבני הנוער."
      }
    ]
  };

  function renderFaq(list, container) {
    container.innerHTML = list
      .map(
        (item, i) => `
      <div class="accordion-item" data-index="${i}">
        <div class="accordion-head">
          <div class="q-icon">${item.icon}</div>
          <h4>${item.q}</h4>
          <span class="chevron">⌄</span>
        </div>
        <div class="accordion-body"><p>${item.a}</p></div>
      </div>`
      )
      .join("");

    container.querySelectorAll(".accordion-item").forEach((el) => {
      el.querySelector(".accordion-head").addEventListener("click", () => {
        el.classList.toggle("open");
      });
    });
  }

  const teensEl = document.getElementById("teens");
  const employersEl = document.getElementById("employers");
  renderFaq(FAQ.teens, teensEl);
  renderFaq(FAQ.employers, employersEl);
  teensEl.querySelector(".accordion-item").classList.add("open");

  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.dataset.tab;
      teensEl.style.display = tab === "teens" ? "block" : "none";
      employersEl.style.display = tab === "employers" ? "block" : "none";
    });
  });
</script>
</body>
</html>
